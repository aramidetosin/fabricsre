[project]
name = "fabricsre"
version = "0.1.0"
description = "FabricSRE: investigation, triage, change assurance and timeline for Cisco Nexus Dashboard managed VXLAN EVPN fabrics"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.1",
  "pyyaml>=6.0",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=0.40"]

[project.scripts]
fabricsre = "fabricsre.cli:main"
fabricsre-mcp = "fabricsre.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fabricsre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
